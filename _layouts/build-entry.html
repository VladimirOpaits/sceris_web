---
layout: default
---
<article class="post build-entry">
  <header class="post-header">
    <div class="post-meta"><a href="{{ '/build/' | relative_url }}">Build log</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time></div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% include gallery.html images=page.images title=page.title %}

  {% if page.links %}
  <ul class="build-links">
    {% for l in page.links %}<li><a href="{{ l.url }}">{{ l.title | default: l.url }}</a></li>{% endfor %}
  </ul>
  {% endif %}
</article>
