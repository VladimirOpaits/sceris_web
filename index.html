---
layout: default
title: Reviews
---
<section class="intro">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</section>

{% if site.posts.size > 0 %}
<ul class="post-list">
  {% for post in site.posts %}
    {% include post-item.html post=post %}
  {% endfor %}
</ul>
{% else %}
<p>No reviews yet.</p>
{% endif %}
